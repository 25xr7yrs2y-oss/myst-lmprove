name: Windows customized client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: custom-node/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Build customized Mysterium node
        shell: pwsh
        working-directory: custom-node
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $buildCommit = "${{ github.sha }}"
          $buildBranch = "${{ github.ref_name }}"
          $buildNumber = "github-${{ github.run_id }}-${{ github.run_attempt }}"
          $buildVersion = "privacy-browser-backend-v1.0.6"
          $ldflags = "-w -s " +
            "-X 'github.com/mysteriumnetwork/node/metadata.BuildCommit=$buildCommit' " +
            "-X 'github.com/mysteriumnetwork/node/metadata.BuildBranch=$buildBranch' " +
            "-X 'github.com/mysteriumnetwork/node/metadata.BuildNumber=$buildNumber' " +
            "-X 'github.com/mysteriumnetwork/node/metadata.Version=$buildVersion'"
          New-Item -ItemType Directory -Force -Path build/myst, build/myst_supervisor
          go build -ldflags="$ldflags" -o build/myst/myst.exe ./cmd/mysterium_node
          go build -ldflags="$ldflags" -o build/myst_supervisor/myst_supervisor.exe ./cmd/supervisor

      - name: Test proxy routing isolation and bounded gateway discovery
        shell: pwsh
        working-directory: custom-node
        run: go test ./router ./p2p ./metadata

      - name: Verify backend build provenance
        shell: pwsh
        working-directory: custom-node
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $versionOutput = (& .\build\myst\myst.exe --version 2>&1 | Out-String).Trim()
          if (!$versionOutput.Contains("privacy-browser-backend-v1.0.6")) {
            throw "Backend version output does not contain the release identifier."
          }
          if (!$versionOutput.Contains("${{ github.sha }}")) {
            throw "Backend version output does not contain the source commit."
          }
          $binary = Get-Item .\build\myst\myst.exe
          $sha256 = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item $binary.FullName .\build\myst-windows-x64.exe
          $versionOutput | Set-Content .\build\myst-version.txt -Encoding UTF8
          [PSCustomObject]@{
            sourceRepository = "https://github.com/${{ github.repository }}"
            sourceCommit = "${{ github.sha }}"
            sourceRef = "${{ github.ref }}"
            workflowRun = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            workflowRunAttempt = "${{ github.run_attempt }}"
            binary = "myst-windows-x64.exe"
            size = $binary.Length
            sha256 = $sha256
            versionOutput = $versionOutput
          } | ConvertTo-Json -Depth 3 | Set-Content .\build\backend-provenance.json -Encoding UTF8

      - name: Upload traceable backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: myst-windows-x64-${{ github.sha }}
          path: |
            custom-node/build/myst-windows-x64.exe
            custom-node/build/myst-version.txt
            custom-node/build/backend-provenance.json
          if-no-files-found: error
          compression-level: 0

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Replace packaged node binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nodeBin = "node_modules/@mysteriumnetwork/node/bin/win/x64"
          if (!(Test-Path custom-node/build/myst/myst.exe)) {
            Get-ChildItem custom-node/build -Recurse
            throw "Customized myst.exe was not produced"
          }
          if (!(Test-Path custom-node/build/myst_supervisor/myst_supervisor.exe)) {
            Get-ChildItem custom-node/build -Recurse
            throw "Customized myst_supervisor.exe was not produced"
          }
          New-Item -ItemType Directory -Force -Path $nodeBin
          Copy-Item custom-node/build/myst/myst.exe "$nodeBin/myst.exe" -Force
          Copy-Item custom-node/build/myst_supervisor/myst_supervisor.exe "$nodeBin/myst_supervisor.exe" -Force

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          yarn build
          yarn run electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: myst-lmprove-windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
  publish-backend:
    if: github.ref == 'refs/tags/privacy-browser-backend-v1.0.6'
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download exact verified backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: myst-windows-x64-${{ github.sha }}
          path: backend-release
      - name: Publish immutable Privacy Browser backend pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          gh release create "${{ github.ref_name }}" \
            backend-release/myst-windows-x64.exe \
            backend-release/myst-version.txt \
            backend-release/backend-provenance.json \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "Privacy Browser backend v1.0.6" \
            --notes-file BACKEND_RELEASE_NOTES_1.0.6.md \
            --prerelease
